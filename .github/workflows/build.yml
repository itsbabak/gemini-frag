
name: Build SocksDroid Fragment (ByeDPI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fragment ARM64 APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 26.1.10909125

    steps:

      # 1. دریافت مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. دریافت سورس اصلی SocksDroid
      - name: Clone Base SocksDroid
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --recurse-submodules \
            https://github.com/bndeff/socksdroid.git base_repo

          cp -rn base_repo/* .

          test -f gradlew
          test -f app/build.gradle

      # 3. ادغام فایل‌های سفارشی
      - name: Merge Custom Fragment Files
        shell: bash
        run: |
          set -euo pipefail

          test -f custom_overlay/app/build.gradle
          test -f custom_overlay/app/src/main/AndroidManifest.xml

          cp -f custom_overlay/app/build.gradle \
            app/build.gradle

          cp -f custom_overlay/app/src/main/AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          mkdir -p app/src/main/java/net/typeblog/socks
          mkdir -p app/src/main/java/net/typeblog/socks/util
          mkdir -p app/src/main/res/layout

          cp -f custom_overlay/app/src/main/java/net/typeblog/socks/MainActivity.java \
            app/src/main/java/net/typeblog/socks/MainActivity.java

          cp -f custom_overlay/app/src/main/java/net/typeblog/socks/SocksVpnService.java \
            app/src/main/java/net/typeblog/socks/SocksVpnService.java

          cp -f custom_overlay/app/src/main/java/net/typeblog/socks/util/FragmentConfigParser.java \
            app/src/main/java/net/typeblog/socks/util/FragmentConfigParser.java

          cp -f custom_overlay/app/src/main/res/layout/activity_main.xml \
            app/src/main/res/layout/activity_main.xml

          echo "Custom files merged."

      # 4. نصب Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. پیدا کردن SDK Manager
      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME}"

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "${SDKMANAGER}" ]; then
            echo "Searching alternative SDK locations..."

            SDKMANAGER="$(find /usr/local/lib/android/sdk \
              -type f -name sdkmanager 2>/dev/null \
              | sort -V | tail -n 1)"
          fi

          if [ -z "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDK Manager: ${SDKMANAGER}"

          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"

          echo "SDKMANAGER_PATH=${SDKMANAGER}" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

      # 6. نصب SDK و NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${SDKMANAGER_PATH}"

          echo "Accepting Android SDK licenses..."

          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

          echo "Installing Android packages..."

          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

          echo "Verifying SDK installation..."

          test -d "${ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_HOME}/build-tools/34.0.0"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "SDK and NDK installed successfully."

      # 7. فعال‌سازی AndroidX
      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          touch gradle.properties

          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if grep -q '^android.enableJetifier=' gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      # 8. دریافت سورس ByeDPI
      - name: Clone ByeDPI
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/hufrea/byedpi.git byedpi_src

          test -f byedpi_src/main.c

      # 9. کامپایل ByeDPI برای ARM64
      - name: Compile ByeDPI ARM64
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_HOME}"

          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android24-clang"

          test -x "${CC}"

          cd byedpi_src

          mapfile -t SOURCES < <(
            find . -maxdepth 1 -type f \
              -name '*.c' \
              ! -name 'win_service.c' \
              | sort
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "No C source files found."
            exit 1
          fi

          echo "Compiling ByeDPI..."

          "${CC}" \
            -O3 \
            -fPIE \
            -pie \
            "${SOURCES[@]}" \
            -o libciadpi.so \
            -llog

          file libciadpi.so

          mkdir -p ../app/src/main/jniLibs/arm64-v8a

          cp libciadpi.so \
            ../app/src/main/jniLibs/arm64-v8a/libciadpi.so

          cd ..

          test -s app/src/main/jniLibs/arm64-v8a/libciadpi.so

          echo "ByeDPI ARM64 binary created."

      # 10. ساخت Keystore
      - name: Generate Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore app/release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias fragment \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=FragmentVPN, OU=Dev, O=Local, L=Local, S=Local, C=US"

      # 11. ساخت APK
      - name: Build Signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            clean \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.jks" \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=fragment \
            -Pandroid.injected.signing.key.password=123456

      # 12. بررسی APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "${APK}" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh "${APK}"

          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"

          if [ -x "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify "${APK}"
          fi

      # 13. آپلود APK
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fragment-ByeDPI-ARM64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
