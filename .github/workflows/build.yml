
name: Build Fragment ARM64 APK - SocksDroid + ByeDPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Fragment ARM64 APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 26.1.10909125

    steps:

      # 1. دریافت مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. استخراج ZIP سفارشی
      - name: Locate and Extract Custom Overlay
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "custom_overlay/app" ]; then
            echo "Overlay already exists."
          else
            ZIP_FILE=""

            while IFS= read -r file; do
              if unzip -l "$file" | grep -q 'custom_overlay/app/build.gradle'; then
                ZIP_FILE="$file"
                break
              fi
            done < <(
              find . -maxdepth 3 -type f -iname '*.zip' \
                ! -path './.git/*'
            )

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Custom ZIP not found."
              exit 1
            fi

            echo "Found: $ZIP_FILE"

            mkdir -p /tmp/fragment_overlay
            unzip -oq "$ZIP_FILE" -d /tmp/fragment_overlay

            OVERLAY_DIR="$(find /tmp/fragment_overlay \
              -type d -name custom_overlay | head -n 1)"

            if [ -z "$OVERLAY_DIR" ]; then
              echo "ERROR: custom_overlay directory not found."
              exit 1
            fi

            cp -a "$OVERLAY_DIR" .

            test -f custom_overlay/app/build.gradle
          fi

          echo "Overlay ready."

      # 3. دریافت سورس اصلی SocksDroid
      - name: Clone Original SocksDroid
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/bndeff/socksdroid.git /tmp/socksdroid

          test -f /tmp/socksdroid/gradlew
          test -f /tmp/socksdroid/app/build.gradle

          cp /tmp/socksdroid/gradlew .
          cp /tmp/socksdroid/build.gradle .
          cp /tmp/socksdroid/settings.gradle .
          cp /tmp/socksdroid/gradle.properties gradle.properties 2>/dev/null || true

          rm -rf gradle
          cp -a /tmp/socksdroid/gradle .

          rm -rf app
          cp -a /tmp/socksdroid/app app

          chmod +x gradlew

          echo "Original SocksDroid source installed."

      # 4. نصب Java 17 - اصلاح خطای فعلی
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 5. بررسی Java
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JAVA_HOME=$JAVA_HOME"

          java -version 2>&1 | grep -q '17' || {
            echo "ERROR: Java 17 is required."
            exit 1
          }

      # 6. پیدا کردن SDK Manager
      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      # 7. نصب SDK و NDK با Java 17
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${SDKMANAGER_PATH}"

          echo "Java version:"
          java -version

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Installing SDK packages..."

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

          echo "Verifying SDK..."

          test -d "${ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_HOME}/build-tools/34.0.0"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" \
            >> "$GITHUB_ENV"

          echo "SDK and NDK installation successful."

      # 8. اعمال رابط کاربری سفارشی
      - name: Apply Custom UI
        shell: bash
        run: |
          set -euo pipefail

          OVERLAY="custom_overlay/app/src/main"

          test -f "$OVERLAY/java/net/typeblog/socks/MainActivity.java"
          test -f "$OVERLAY/java/net/typeblog/socks/util/FragmentConfigParser.java"
          test -f "$OVERLAY/res/layout/activity_main.xml"
          test -f "$OVERLAY/AndroidManifest.xml"

          cp "$OVERLAY/java/net/typeblog/socks/MainActivity.java" \
            app/src/main/java/net/typeblog/socks/MainActivity.java

          mkdir -p app/src/main/java/net/typeblog/socks/util

          cp "$OVERLAY/java/net/typeblog/socks/util/FragmentConfigParser.java" \
            app/src/main/java/net/typeblog/socks/util/FragmentConfigParser.java

          cp "$OVERLAY/res/layout/activity_main.xml" \
            app/src/main/res/layout/activity_main.xml

          cp "$OVERLAY/AndroidManifest.xml" \
            app/src/main/AndroidManifest.xml

          echo "Custom UI applied."

      # 9. تنظیم Gradle و AndroidX
      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          touch gradle.properties

          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if grep -q '^android.enableJetifier=' gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          source = path.read_text()

          source = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 34',
              source
          )

          source = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 34',
              source
          )

          if "abiFilters" not in source:
              pattern = r'(defaultConfig\s*\{)'
              replacement = (
                  r'\1\n'
                  r'        ndk {\n'
                  r"            abiFilters 'arm64-v8a'\n"
                  r'        }\n'
              )

              source, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1
              )

              if count != 1:
                  raise SystemExit("defaultConfig not found")

          if "androidx.appcompat:appcompat" not in source:
              source += """
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity:1.8.2'
          }
          """

          path.write_text(source)
          print("Gradle configured.")
          PY

      # 10. بررسی سورس اصلی
      - name: Verify Original Source
        shell: bash
        run: |
          set -euo pipefail

          BASE="app/src/main/java/net/typeblog/socks"

          REQUIRED=(
            "$BASE/SocksVpnService.java"
            "$BASE/util/Utility.java"
            "$BASE/util/Constants.java"
            "$BASE/util/Profile.java"
            "$BASE/util/ProfileManager.java"
            "$BASE/MainActivity.java"
            "$BASE/util/FragmentConfigParser.java"
          )

          for file in "${REQUIRED[@]}"; do
            test -f "$file" || {
              echo "Missing source: $file"
              exit 1
            }
            echo "OK: $file"
          done

          grep -q "startVpn(Context context, Profile profile)" \
            "$BASE/util/Utility.java"

          grep -q "INTENT_APP_BYPASS" "$BASE/util/Constants.java"
          grep -q "INTENT_UDP_GW" "$BASE/util/Constants.java"

          echo "Source verification passed."

      # 11. دریافت ByeDPI
      - name: Clone ByeDPI
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/hufrea/byedpi.git byedpi_src

          test -f byedpi_src/main.c

      # 12. کامپایل ByeDPI برای ARM64
      - name: Build ByeDPI ARM64
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android24-clang"

          test -x "$CC"

          cd byedpi_src

          mapfile -t SOURCES < <(
            find . -type f -name '*.c' \
              ! -name 'win_service.c' \
              ! -path './.git/*' \
              | sort
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "No C source files found."
            exit 1
          fi

          echo "Compiling ByeDPI..."

          "$CC" \
            -O2 \
            -fPIE \
            -pie \
            -DANDROID \
            "${SOURCES[@]}" \
            -o libciadpi.so

          file libciadpi.so

          mkdir -p ../app/src/main/jniLibs/arm64-v8a

          cp libciadpi.so \
            ../app/src/main/jniLibs/arm64-v8a/libciadpi.so

          cd ..

          test -s app/src/main/jniLibs/arm64-v8a/libciadpi.so

          echo "ByeDPI ARM64 binary created."

      # 13. ساخت Keystore
      - name: Generate Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore app/release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias fragment \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=FragmentVPN, OU=Dev, O=Local, L=Local, S=Local, C=US"

      # 14. ساخت APK
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.jks" \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=fragment \
            -Pandroid.injected.signing.key.password=123456

      # 15. بررسی APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"

          "$APKSIGNER" verify "$APK"

          echo "APK signature verified."

      # 16. آپلود APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fragment-ByeDPI-ARM64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
