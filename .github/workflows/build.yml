
name: Build SocksDroid Fragment (ByeDPI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fragment ARM64 APK
    runs-on: ubuntu-24.04

    steps:
      # 1. دریافت سورس
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. دریافت SocksDroid اصلی و ادغام فایل‌های سفارشی
      - name: Clone Base SocksDroid & Merge Custom Files
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/bndeff/socksdroid.git base_repo

          rm -rf base_repo/.git

          cp -rn base_repo/. ./

          cp -f custom_overlay/app/build.gradle app/build.gradle
          cp -f custom_overlay/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml

          mkdir -p app/src/main/java/net/typeblog/socks/util
          mkdir -p app/src/main/res/layout

          cp -f custom_overlay/app/src/main/java/net/typeblog/socks/MainActivity.java app/src/main/java/net/typeblog/socks/MainActivity.java

          cp -f custom_overlay/app/src/main/java/net/typeblog/socks/SocksVpnService.java app/src/main/java/net/typeblog/socks/SocksVpnService.java

          cp -f custom_overlay/app/src/main/java/net/typeblog/socks/util/FragmentConfigParser.java app/src/main/java/net/typeblog/socks/util/FragmentConfigParser.java

          cp -f custom_overlay/app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_main.xml

          echo "Custom files merged successfully."

      # 3. فعال‌سازی AndroidX و Jetifier
      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          touch gradle.properties

          grep -q '^android.useAndroidX=' gradle.properties \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties \
            && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

          echo "Gradle properties:"
          cat gradle.properties

      # 4. نصب Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # 5. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. نصب NDK
      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;26.1.10909125"

      # 7. کامپایل ByeDPI برای ARM64
      - name: Clone & Compile ByeDPI
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/hufrea/byedpi.git byedpi_src

          cd byedpi_src

          export NDK="$ANDROID_HOME/ndk/26.1.10909125"

          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          $CC -O3 -fPIE -pie *.c -o libciadpi.so -llog

          mkdir -p ../app/src/main/jniLibs/arm64-v8a

          cp libciadpi.so ../app/src/main/jniLibs/arm64-v8a/

          echo "ByeDPI ARM64 compiled successfully."

      # 8. ساخت Keystore
      - name: Generate Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkey -v \
            -keystore app/release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias fragment \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=FragmentVPN, OU=Dev, O=Local, L=Shiraz, S=Fars, C=IR"

      # 9. بررسی تنظیمات Gradle
      - name: Verify Gradle Configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle.properties
          test -f app/build.gradle

          grep -q '^android.useAndroidX=true$' gradle.properties

          chmod +x gradlew

          echo "Gradle configuration verified."

      # 10. ساخت APK امضاشده
      - name: Build Signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.jks" \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=fragment \
            -Pandroid.injected.signing.key.password=123456

      # 11. بررسی خروجی
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release"

          find "$APK" -type f -name "*.apk"

          test -n "$(find "$APK" -type f -name '*.apk' -print -quit)"

          echo "APK successfully generated."

      # 12. آپلود APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FragmentVPN-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
